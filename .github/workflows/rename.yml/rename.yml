name: Rename space.html to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git mv space.html index.html
          git config user.name "jusir666"
          git config user.email "jusir666@users.noreply.github.com"
          git commit -m "Rename space.html to index.html"
          git push
